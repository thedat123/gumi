<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Level Down — Gumi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B83556"/>
      <stop offset="1" stop-color="#E4A6B2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="205" fill="url(#glow)"/>
  <!-- vùng an toàn maskable ~80%: nhân vật nằm trong khoảng 100..412 -->
  <g transform="translate(256 272)">
    <!-- lớp viền đen (tai + đầu) -->
    <g fill="#26190F" stroke="#26190F" stroke-width="26" stroke-linejoin="round">
      <path d="M-150 -34 L-138 -170 L-42 -74 Z"/>
      <path d="M150 -34 L138 -170 L42 -74 Z"/>
      <circle cx="0" cy="0" r="140"/>
    </g>
    <!-- lớp màu cam -->
    <g fill="#F5A31C">
      <path d="M-150 -34 L-138 -170 L-42 -74 Z"/>
      <path d="M150 -34 L138 -170 L42 -74 Z"/>
      <circle cx="0" cy="0" r="140"/>
    </g>
    <!-- má ửng -->
    <ellipse cx="-94" cy="40" rx="30" ry="17" fill="#F58C86" opacity="0.85"/>
    <ellipse cx="94" cy="40" rx="30" ry="17" fill="#F58C86" opacity="0.85"/>
    <!-- râu -->
    <g stroke="#26190F" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M-80 30 l-52 -8 M-80 42 l-54 6 M80 30 l52 -8 M80 42 l54 6"/>
    </g>
    <!-- chân mày xị -->
    <path d="M-98 -36 q34 4 56 28 M98 -36 q-34 4 -56 28" stroke="#26190F" stroke-width="13" stroke-linecap="round" fill="none"/>
    <!-- mắt: nhãn cầu trắng + mí trên nặng + con ngươi thấp + bắt sáng -->
    <ellipse cx="-54" cy="6" rx="34" ry="40" fill="#fff" stroke="#26190F" stroke-width="10"/>
    <ellipse cx="54" cy="6" rx="34" ry="40" fill="#fff" stroke="#26190F" stroke-width="10"/>
    <ellipse cx="-54" cy="24" rx="27" ry="20" fill="#26190F"/>
    <ellipse cx="54" cy="24" rx="27" ry="20" fill="#26190F"/>
    <path d="M-88 6 A34 40 0 0 1 -20 6 Q-54 16 -88 6 Z" fill="#26190F"/>
    <path d="M20 6 A34 40 0 0 1 88 6 Q54 16 20 6 Z" fill="#26190F"/>
    <circle cx="-46" cy="18" r="7" fill="#fff"/>
    <circle cx="62" cy="18" r="7" fill="#fff"/>
    <!-- mũi + miệng + răng nanh -->
    <path d="M-11 44 h22 l-11 13 z" fill="#C9764E"/>
    <path d="M-16 62 q16 10 32 0" stroke="#26190F" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M-3 60 l0 15 l9 -7 z" fill="#fff" stroke="#26190F" stroke-width="4" stroke-linejoin="round"/>
    <!-- ngôi sao nhấn -->
    <path d="M150 -152 l10 22 l24 2 l-18 16 l6 24 l-22 -13 l-22 13 l6 -24 l-18 -16 l24 -2 z" fill="#F5C542"/>
  </g>
</svg>

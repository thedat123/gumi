<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Level Down — Gumi">
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#C23A5A"/>
      <stop offset="0.55" stop-color="#CF5370"/>
      <stop offset="1" stop-color="#E7A3B1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="1.02" r="0.85">
      <stop offset="0" stop-color="#7A1E38" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#7A1E38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBB63A"/>
      <stop offset="1" stop-color="#F39A18"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#vig)"/>
  <circle cx="256" cy="226" r="230" fill="url(#glow)"/>

  <!-- bóng đổ dưới đầu cho chiều sâu -->
  <ellipse cx="256" cy="430" rx="150" ry="26" fill="#5E1226" opacity="0.22"/>

  <!-- vùng an toàn maskable ~80%: nội dung nằm trong khoảng 100..412 -->
  <g transform="translate(256 262)">
    <!-- lớp viền đen (tai + đầu) -->
    <g fill="#231812" stroke="#231812" stroke-width="28" stroke-linejoin="round">
      <path d="M-150 -40 L-138 -178 L-40 -78 Z"/>
      <path d="M150 -40 L138 -178 L40 -78 Z"/>
      <circle cx="0" cy="0" r="146"/>
    </g>
    <!-- lớp màu cam -->
    <g fill="url(#fur)">
      <path d="M-150 -40 L-138 -178 L-40 -78 Z"/>
      <path d="M150 -40 L138 -178 L40 -78 Z"/>
      <circle cx="0" cy="0" r="146"/>
    </g>
    <!-- tai trong -->
    <path d="M-132 -68 L-124 -150 L-70 -72 Z" fill="#E07E63" opacity="0.55"/>
    <path d="M132 -68 L124 -150 L70 -72 Z" fill="#E07E63" opacity="0.55"/>

    <!-- má ửng hồng -->
    <ellipse cx="-98" cy="52" rx="33" ry="17" fill="#F5857F" opacity="0.85"/>
    <ellipse cx="98" cy="52" rx="33" ry="17" fill="#F5857F" opacity="0.85"/>

    <!-- râu -->
    <g stroke="#231812" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M-86 34 l-58 -10 M-86 48 l-60 8 M86 34 l58 -10 M86 48 l60 8"/>
    </g>

    <!-- chân mày dày, xị (bất cần) -->
    <path d="M-104 -40 q40 -2 64 18" stroke="#231812" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M104 -40 q-40 -2 -64 18" stroke="#231812" stroke-width="15" stroke-linecap="round" fill="none"/>

    <!-- MẮT lim dim: nhãn trắng rộng + mí trên NẶNG phẳng + con ngươi to nằm thấp + bắt sáng -->
    <g>
      <!-- trái -->
      <ellipse cx="-56" cy="8" rx="40" ry="34" fill="#fff" stroke="#231812" stroke-width="9"/>
      <ellipse cx="-56" cy="22" rx="31" ry="25" fill="#231812"/>
      <path d="M-96 2 Q-56 -40 -16 2 Q-56 14 -96 2 Z" fill="#231812"/>
      <circle cx="-45" cy="14" r="8" fill="#fff"/>
      <!-- phải -->
      <ellipse cx="56" cy="8" rx="40" ry="34" fill="#fff" stroke="#231812" stroke-width="9"/>
      <ellipse cx="56" cy="22" rx="31" ry="25" fill="#231812"/>
      <path d="M16 2 Q56 -40 96 2 Q56 14 16 2 Z" fill="#231812"/>
      <circle cx="67" cy="14" r="8" fill="#fff"/>
    </g>

    <!-- mũi + miệng + răng nanh -->
    <path d="M-12 50 h24 l-12 14 z" fill="#C9764E"/>
    <path d="M0 64 q-16 14 -30 4 M0 64 q16 14 30 4" stroke="#231812" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <path d="M-4 62 l0 16 l9 -7 z" fill="#fff" stroke="#231812" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- ngôi sao nhấn (trong vùng an toàn) -->
  <g transform="translate(372 120)">
    <path d="M0 -24 l7 16 l17 2 l-13 12 l4 17 l-15 -9 l-15 9 l4 -17 l-13 -12 l17 -2 z" fill="#F5C542" stroke="#D89A1E" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>

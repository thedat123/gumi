<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#B83556" />
    <title>Mất kết nối — Level Down</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #FADED2; color: #3A241E;
             font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; }
      .card { max-width: 320px; }
      h1 { font-size: 20px; margin: 12px 0 8px; }
      p { font-size: 14px; color: #6E4A3E; margin: 0 0 16px; }
      a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 20px; border-radius: 12px;
          background: #B83556; color: #fff; text-decoration: none; font-weight: 600; }
      .emoji { font-size: 44px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji" aria-hidden="true">📡</div>
      <h1>Mất kết nối</h1>
      <p>Có vẻ bạn đang ngoại tuyến. Kiểm tra mạng rồi thử lại nhé.</p>
      <a href="/">Thử lại</a>
    </div>
  </body>
</html>

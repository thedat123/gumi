name: CI/CD

# PR/đẩy lên main: chạy kiểm thử. Khi PUSH lên main và kiểm thử xanh → tự deploy lên Cloudflare Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        # Bake biến Supabase vào bundle (Vite đọc VITE_* lúc build) → dùng adapter thật, không rơi về mock.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy · Cloudflare Pages
    needs: check
    # Chỉ deploy khi PUSH lên main (bỏ qua pull_request).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài dependencies
        run: npm ci
      # Đúng lệnh `npm run deploy` chạy ở máy: build → đóng dấu sw.js → wrangler pages deploy.
      # wrangler tự đọc token/account từ 2 biến môi trường dưới đây (không cần wrangler login).
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Bake biến Supabase vào bundle production (Vite đọc VITE_* lúc build) → OAuth Google thật chạy.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Nhận diện ảnh check-in: KHÔNG map ở đây thì Vite build ra key rỗng → app rơi về on-device (chậm + đọc sai).
          VITE_GCV_API_KEY: ${{ secrets.VITE_GCV_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          # Các biến prod khác (để trống nếu chưa tạo secret cũng không sao).
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

  supabase:
    name: Deploy · Supabase (migration · secrets · functions)
    needs: check
    # Chỉ chạy khi PUSH lên main. Song song với deploy Cloudflare.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secrets bắt buộc
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          missing=0
          for k in SUPABASE_ACCESS_TOKEN PROJECT_REF SUPABASE_DB_URL; do
            if [ -z "${!k}" ]; then echo "::error::Thiếu GitHub secret: $k"; missing=1; fi
          done
          exit $missing
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Chỉ chạy migration MỚI (đã ghi trong bảng gumi_schema_migrations thì bỏ qua).
      - name: Migration
        run: python3 scripts/migrate.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Đẩy secrets từ GitHub sang Supabase (bỏ qua biến nào chưa đặt). VAPID_* đã có sẵn trên Supabase.
      - name: Đồng bộ secrets cho Edge Functions
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REMINDER_EMAIL_FROM: ${{ secrets.REMINDER_EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
          EMAIL_UNSUB_SECRET: ${{ secrets.EMAIL_UNSUB_SECRET }}
          EMAIL_SLOTS: ${{ secrets.EMAIL_SLOTS }}
          EMAIL_DAILY_CAP: ${{ secrets.EMAIL_DAILY_CAP }}
          EMAIL_BATCH: ${{ secrets.EMAIL_BATCH }}
        run: |
          args=()
          for k in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS REMINDER_EMAIL_FROM APP_URL EMAIL_UNSUB_SECRET EMAIL_SLOTS EMAIL_DAILY_CAP EMAIL_BATCH; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; else echo "Chưa có secret nào để đồng bộ"; fi
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy send-reminders --project-ref "$PROJECT_REF"
          supabase functions deploy email-unsubscribe --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy share-card --no-verify-jwt --project-ref "$PROJECT_REF"

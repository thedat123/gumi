name: Push reminders

# Production reminders run every minute via Supabase pg_cron.
# GitHub remains manual-only because scheduled Actions can be delayed.
on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Gửi NGAY một noti thử cho mọi subscription (bỏ qua lịch)'
        type: boolean
        default: false

concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gửi nhắc nhở
        run: node --import tsx scripts/send-reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FORCE_SEND: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '1' || '' }}
